<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STTA Score Sheet</title>
<style>
:root{--out:#d5d9dc;--ink:#111;--pen:#0b2a8a;--p1:#b4ec2a;--p2:#ffd91f;--bad:#c62828;--pad:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--out:#0e1317;--pad:#e9edf0}}
:root[data-theme="dark"]{--out:#0e1317;--pad:#e9edf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:8px 0 24px;background:var(--out);font:14px/1.2 Calibri,"Segoe UI",system-ui,sans-serif;touch-action:manipulation;color:#111}
body.padOn{padding-bottom:300px}
button,select,input{font:inherit;color:inherit}
.paper{width:780px;margin:0 auto;padding:12px 14px 14px;color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.35)}
.g1{background:var(--p1)}.g2{background:var(--p2)}.g3{background:#ffb3d1}.g4{background:#9fd8ff}
.top{display:grid;grid-template-columns:110px 1fr 150px;align-items:center}
.logo{height:88px;width:auto;display:block}
.top h1{font:700 22px/1.1 Cambria,"Times New Roman",serif;margin:0;text-align:center}
.url{font-size:11px;text-align:right;text-decoration:underline}
.tbl{border:2px solid #111;margin-top:4px;padding:2px 4px;font-size:11px}
.tbl select{width:100%;min-height:34px;border:none;background:transparent;font-weight:700;font-size:18px;color:var(--pen)}
.sub{font:700 22px Cambria,"Times New Roman",serif;text-align:center;margin:8px 0 2px;display:flex;justify-content:center;align-items:center;gap:10px}
.gb,.sb{border:2px solid #111;background:transparent;border-radius:6px;font:700 18px Cambria,serif;min-height:40px;padding:0 12px;cursor:pointer}
.gb.on{background:#111;color:#fff}
.rnd{font:700 18px Cambria,"Times New Roman",serif;display:flex;justify-content:center;align-items:center;gap:8px}
.sb{width:44px;padding:0}
.rnd input{border:2px solid #111;border-radius:6px;background:transparent;min-height:40px;font:700 16px Calibri,system-ui,sans-serif;color:var(--pen);padding:0 6px}
table.sc{border-collapse:collapse;width:750px;table-layout:fixed;margin:8px auto 0}
.sc td,.sc th{border:1.5px solid #111;padding:0;text-align:center;font-weight:700;height:38px}
.sc th{font-size:12px;height:auto;padding:2px}
.sc td.tb{vertical-align:top;text-align:left;padding:4px 6px;height:auto}
.tb select{width:100%;border:none;border-bottom:1px dotted #111;background:transparent;border-radius:0;font-weight:700;color:var(--pen);min-height:32px;padding:0;font-size:13px;appearance:none;-webkit-appearance:none}
.tb select.tn{font-size:16px}
.pr{display:flex;align-items:center;gap:4px}.pr b{font-size:11px;width:10px}
.lbl{font-size:13px;margin-top:4px}
.nm{text-align:left!important;padding:0 3px!important;color:var(--pen);font-size:14px;overflow:hidden;white-space:nowrap}
.nm select{width:100%;border:none;background:transparent;font-weight:700;color:var(--pen);font-size:12px;min-height:34px;appearance:none;-webkit-appearance:none;padding:0}
.dv{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px}
.c{display:block;width:32px;height:32px;margin:2px auto;padding:0;border:none;border-radius:50%;background:transparent;font:700 20px Calibri,system-ui,sans-serif;color:var(--pen);cursor:pointer}
.c.win{box-shadow:inset 0 0 0 2px var(--pen)}
.c.bad{color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.c.sel{background:#fff;box-shadow:0 0 0 3px #111}
.sm{font-size:20px;color:var(--pen)}
.ftl{text-align:left!important;padding:0 6px!important;font-size:13px}
.ftl span{float:right}
.wt{border-collapse:collapse;width:100%;margin-top:14px}
.wt td,.wt th{border:1.5px solid #111;height:38px;text-align:center;font-weight:700;padding:0 6px}
.wt th{font-size:13px;height:28px}
.wt .wl{width:110px;text-align:left}
.wt .w2{width:110px}
.wt td+td{color:var(--pen);font-size:20px}
.tgm{text-align:right;font-size:20px;font-weight:700;color:var(--pen);min-height:28px;padding:2px 20px}
.fi{margin-top:6px}.fi b{font:700 15px Cambria,"Times New Roman",serif}.ft{border-collapse:collapse;width:100%;margin-top:4px}.ft th,.ft td{border:1.5px solid #111;height:38px;padding:0 6px}.ft th{font-size:12px;height:auto;padding:2px}.ft select,.ft input{width:100%;border:none;background:transparent;font-weight:700;color:var(--pen);min-height:34px;font-size:15px}
.acts{width:780px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.acts button{min-height:48px;padding:8px 16px;border:2px solid #111;border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
.acts button.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
#res{width:780px;margin:6px auto 0;font-weight:700;color:var(--pad);min-height:20px}
#pad{position:fixed;left:0;right:0;bottom:0;background:var(--pad);color:#111;border-top:3px solid #111;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.3)}
#pad[hidden]{display:none}
#pad .in{max-width:760px;margin:0 auto}
#pad .top2{margin-bottom:6px;font-weight:700}
#pad .keys{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#pad .keys button{min-height:52px;font-size:21px;font-weight:700;padding:0;border:2px solid #111;border-radius:8px;background:#fff;color:#111}
#pad .keys .w{grid-column:span 2;font-size:18px}
#pad .keys .done{background:#111;color:#fff}
</style>
</head>
<body>
<div class="paper g1" id="paper"></div>
<div class="acts">
  <button id="copy">Copy result</button>
  <button id="clr" data-c="Clear scores">Clear scores</button>
  <button id="new" data-c="New sheet">New sheet</button>
</div>
<div id="res"></div>
<div id="pad" hidden><div class="in"><div class="top2" id="plab"></div><div class="keys" id="keys"></div></div></div>
